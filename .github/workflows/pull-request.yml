name: Pull Request Checks

on: pull_request

jobs:

  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            django: "Django~=4.2.0"
          - python: "3.11"
            django: "Django~=5.2.0"
          - python: "3.14"
            django: "Django~=6.0"

    steps:
      - name: 'Checkout Github Action'
        uses: actions/checkout@v4

      - name: 'Install uv'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 'Install Dependencies'
        run: uv sync --python '${{ matrix.python }}'

      - name: Select Django version
        run: uv pip install -e . "${{ matrix.django }}"

      - name: 'Run Python Unit Tests'
        run: uv run --no-sync python manage.py test

      - name: Check migration state
        run: uv run --no-sync python manage.py makemigrations --check --dry-run

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Github Action'
        uses: actions/checkout@v4

      - name: 'Install uv'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: 'Install Dependencies'
        run: uv sync

      - name: 'Install Playwright system dependencies'
        run: sudo uv run --no-sync playwright install-deps chromium

      - name: 'Install Chromium'
        run: uv run --no-sync playwright install chromium

      - name: 'Run End-to-End Tests'
        run: make e2e

  vue-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm test && npm run build
        working-directory: formification/static/admin/formification/vue-formification
      - name: Verify committed production assets
        run: |
          test -z "$(git status --porcelain -- formification/static/admin/formification/vue-formification/dist)"
      - uses: astral-sh/setup-uv@v5
      - run: uv build

  form-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: formification/static/formification/vite-formification
      - name: Verify committed production assets
        run: |
          test -z "$(git status --porcelain -- formification/static/formification/vite-formification/dist)"

  run-linter:
    name: Lint Code Base
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync

      - name: Check for Modified Python Files
        run: echo "py_diff=$(git diff --name-only --diff-filter=ACMRTUXB origin/$GITHUB_BASE_REF | grep  -E "(.py$)" | tr "\n" " ")" >> $GITHUB_ENV

      - name: Run Black - Confirm files have been formatted using Black
        if: ${{ env.py_diff != '' }}
        run: uv run black ${{env.py_diff}} --check

      - name: Run Python Linter
        if: ${{ env.py_diff != '' }}
        run: uv run flake8 ${{env.py_diff}} --ignore=E501,F405,W503